<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMS Guard{% endblock %}</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">🛡️ SMS Guard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Дашборд</a></li>
        <li class="nav-item"><a class="nav-link" href="/sms/">SMS тексеру</a></li>
        <li class="nav-item"><a class="nav-link" href="/url/">URL тексеру</a></li>
        <li class="nav-item"><a class="nav-link" href="/dashboard/">Статистика</a></li>
      </ul>
    </div>
  </div>
</nav>

{% if messages %}
<div class="container mt-3">
  {% for m in messages %}
    <div class="alert alert-info">{{ m }}</div>
  {% endfor %}
</div>
{% endif %}

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="container py-3 text-muted small">
  © 2026 SMS Guard · Бағалау ықтималдық сипатта · қауіпсіздікке кепілдік бермейді.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
